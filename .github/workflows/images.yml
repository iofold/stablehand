name: Images

# Builds and pushes the prebuilt images that docker-compose.yml and its
# overlays name: ghcr.io/<owner>/stablehand-<name>. install.sh pulls these and
# falls back to a local build when a tag is missing.
#
# Tags:
#   push to master  -> latest, master, sha-<full commit sha>
#   tag v1.2.3      -> 1.2.3, 1.2, sha-<full commit sha>
# STABLEHAND_IMAGE_TAG in .env picks one; install.sh tries sha-<HEAD> first.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.image }}
    # Only the public repository publishes. Forks and private mirrors of it
    # must not push to the same package names.
    if: github.repository == 'iofold/stablehand'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: stablehand-orchestrator
            context: .
            file: Dockerfile
            target: orchestrator
          - image: stablehand-ui
            context: .
            file: Dockerfile
            target: ui
          - image: stablehand-egress
            context: packages/egress-proxy
            file: packages/egress-proxy/Dockerfile
            target: ''
          - image: stablehand-harness-langgraph
            context: .
            file: Dockerfile.sandbox
            target: harness-langgraph
          - image: stablehand-harness-claude-agents
            context: .
            file: Dockerfile.sandbox
            target: harness-claude-agents
          - image: stablehand-harness-pi-agent
            context: .
            file: Dockerfile.sandbox
            target: harness-pi-agent
          - image: stablehand-artifact-gallery
            context: extensions/artifact-gallery
            file: extensions/artifact-gallery/Dockerfile
            target: ''
          - image: stablehand-model-gateway
            context: .
            file: deploy/compose/model-gateway/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stablehand
          POSTGRES_PASSWORD: stablehand
          POSTGRES_DB: stablehand_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stablehand -d stablehand_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # DB-backed suites drop and recreate tables and refuse to run without this.
      TEST_DATABASE_URL: postgres://stablehand:stablehand@localhost:5432/stablehand_test
      # artifact-storage.test.ts runs against a real S3-compatible store (started below).
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: stablehand
      S3_SECRET_KEY: stablehand-dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # The operational CLI (.codex/skills/stablehand-cli) is a Bun script; ops.test.ts runs it.
      - uses: oven-sh/setup-bun@v2
      # Same image as the compose `minio` service (MinIO no longer publishes pullable images).
      - name: Start S3 store (RustFS)
        run: |
          docker run -d --name s3 -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY="$S3_ACCESS_KEY" -e RUSTFS_SECRET_KEY="$S3_SECRET_KEY" \
            rustfs/rustfs:1.0.0
          timeout 60 bash -c 'until curl -sf http://localhost:9000/health; do sleep 1; done'
      - run: pnpm install
      - name: Build
        run: pnpm -r build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Backend tests (strict mode)
        run: pnpm test:backend
        env:
          STABLEHAND_STRICT_TESTS: '1'
      - name: UI tests
        run: pnpm test:ui
      - name: React package tests
        run: pnpm test:react

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Audit production dependencies
        run: pnpm audit:prod

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    # Job-level so both `docker compose up` (the orchestrator reads them) and the
    # Playwright step see them. Unset secrets resolve to empty strings; the smoke tests
    # that make real model calls then skip instead of failing.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Build
        run: pnpm -r build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start Docker stack
        run: |
          docker compose down -v || true
          # docker-compose.yml attaches the UI to dev1's external Traefik network.
          docker network create web 2>/dev/null || true
          cp .env.example .env
          echo "SECRET_MASTER_KEY=$(openssl rand -hex 32)" >> .env
          STABLEHAND_API_TOKEN="$(openssl rand -hex 32)"
          echo "STABLEHAND_API_TOKEN=$STABLEHAND_API_TOKEN" >> .env
          echo "STABLEHAND_API_TOKEN=$STABLEHAND_API_TOKEN" >> "$GITHUB_ENV"
          docker compose up --build -d
      - name: Wait for Docker services
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3002/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:3200 > /dev/null; do sleep 2; done'
      - name: Run required E2E smoke gate
        run: pnpm test:e2e -- --project=chromium --grep @smoke
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3200
          PLAYWRIGHT_API_BASE_URL: http://localhost:3002
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: .tmp/playwright-report-docker/
          retention-days: 7
      - name: Show Docker logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop Docker stack
        if: always()
        run: docker compose down -v

  images:
    name: Build deployable images (ctx-o0e)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build orchestrator image
        run: docker build --target orchestrator -t stablehand/orchestrator:ci -f Dockerfile .
      - name: Build UI image
        run: docker build --target ui -t stablehand/ui:ci -f Dockerfile .
      - name: Build harness images
        run: |
          docker build --target harness-langgraph -t stablehand/harness-langgraph:ci -f Dockerfile.sandbox .
          docker build --target harness-claude-agents -t stablehand/harness-claude-agents:ci -f Dockerfile.sandbox .
          docker build --target harness-pi-agent -t stablehand/harness-pi-agent:ci -f Dockerfile.sandbox .

  dev2-deploy:
    name: Deploy to dev2 + smoke (ADR 009)
    runs-on: ubuntu-latest
    needs: [e2e, images]
    # Enable by setting the repository variable DEV2_DEPLOY_ENABLED=true after
    # provisioning (ctx-o0e):
    #   - secrets.DEV2_KUBECONFIG        — kubeconfig file content for dev2 k3s
    #   - secrets.DEV2_SSH_PRIVATE_KEY   — key authorized on ubuntu@dev2 (image import)
    #   - secrets.TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET — Tailscale OAuth for an
    #     ephemeral runner node; dev2 is reachable only on the tailnet
    #   - vars.DEV2_SSH_HOST             — tailnet address of the dev2 host
    #   - secrets.OPENAI_API_KEY / ANTHROPIC_API_KEY — provider keys for the
    #     three live-harness smoke cases
    # Operators run deploy/k3s/dev2/deploy-dev2.sh manually until then (see
    # docs/release-gates.md).
    if: ${{ vars.DEV2_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Join tailnet (dev2 is Tailscale-only)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Write dev2 credentials
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEV2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.DEV2_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "${{ secrets.DEV2_KUBECONFIG }}" > "$RUNNER_TEMP/dev2-kubeconfig.yaml"
      - name: Build, import, and roll out to dev2
        run: deploy/k3s/dev2/deploy-dev2.sh
        env:
          KUBECONFIG: ${{ runner.temp }}/dev2-kubeconfig.yaml
          K3S_IMPORT_HOST: ubuntu@${{ vars.DEV2_SSH_HOST }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run required smoke against dev2
        run: |
          export STABLEHAND_API_TOKEN="$(kubectl -n stablehand get secret stablehand-core-secrets -o jsonpath='{.data.STABLEHAND_API_TOKEN}' | base64 -d)"
          pnpm test:e2e:required
        env:
          KUBECONFIG: ${{ runner.temp }}/dev2-kubeconfig.yaml
          PLAYWRIGHT_BASE_URL: https://stablehand.staging.example.com
          PLAYWRIGHT_API_BASE_URL: https://stablehand.staging.example.com
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install
      - name: Build
        run: pnpm -r build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Backend tests (strict mode)
        run: pnpm test:backend
        env:
          CTXMILL_STRICT_TESTS: '1'
      - name: UI tests
        run: pnpm test:ui

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Audit production dependencies
        run: pnpm audit:prod

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Build
        run: pnpm -r build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start Docker stack
        run: |
          docker compose down -v || true
          cp .env.example .env
          echo "SECRET_MASTER_KEY=$(openssl rand -hex 32)" >> .env
          CTXMILL_API_TOKEN="$(openssl rand -hex 32)"
          echo "CTXMILL_API_TOKEN=$CTXMILL_API_TOKEN" >> .env
          echo "CTXMILL_API_TOKEN=$CTXMILL_API_TOKEN" >> "$GITHUB_ENV"
          docker compose up --build -d
      - name: Wait for Docker services
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3002/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:3200 > /dev/null; do sleep 2; done'
      - name: Run required E2E smoke gate
        run: pnpm test:e2e -- --project=chromium --grep @smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PLAYWRIGHT_BASE_URL: http://localhost:3200
          PLAYWRIGHT_API_BASE_URL: http://localhost:3002
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: .tmp/playwright-report-docker/
          retention-days: 7
      - name: Show Docker logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop Docker stack
        if: always()
        run: docker compose down -v

  images:
    name: Build deployable images (ctx-o0e)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build orchestrator image
        run: docker build --target orchestrator -t ctxmill/orchestrator:ci -f Dockerfile .
      - name: Build UI image
        run: docker build --target ui -t ctxmill/ui:ci -f Dockerfile .
      - name: Build harness images
        run: |
          docker build --target harness-langgraph -t ctxmill/harness-langgraph:ci -f Dockerfile.sandbox .
          docker build --target harness-claude-agents -t ctxmill/harness-claude-agents:ci -f Dockerfile.sandbox .
          docker build --target harness-pi-agent -t ctxmill/harness-pi-agent:ci -f Dockerfile.sandbox .

  dev2-deploy:
    name: Deploy to dev2 + smoke (ADR 009)
    runs-on: ubuntu-latest
    needs: [e2e, images]
    # Enable by setting the repository variable DEV2_DEPLOY_ENABLED=true after
    # provisioning (ctx-o0e):
    #   - secrets.DEV2_KUBECONFIG        — kubeconfig file content for dev2 k3s
    #   - secrets.DEV2_SSH_PRIVATE_KEY   — key authorized on ubuntu@dev2 (image import)
    #   - secrets.TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET — Tailscale OAuth for an
    #     ephemeral runner node; dev2 ([redacted-ip]) is reachable only on the
    #     tailnet
    #   - secrets.OPENAI_API_KEY / ANTHROPIC_API_KEY — provider keys for the
    #     three live-harness smoke cases
    # Operators run deploy/k3s/dev2/deploy-dev2.sh manually until then (see
    # docs/verification/release-gates.md).
    if: ${{ vars.DEV2_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Join tailnet (dev2 is Tailscale-only)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Write dev2 credentials
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEV2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -H [redacted-ip] >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "${{ secrets.DEV2_KUBECONFIG }}" > "$RUNNER_TEMP/dev2-kubeconfig.yaml"
      - name: Build, import, and roll out to dev2
        run: deploy/k3s/dev2/deploy-dev2.sh
        env:
          KUBECONFIG: ${{ runner.temp }}/dev2-kubeconfig.yaml
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run required smoke against dev2
        run: |
          export CTXMILL_API_TOKEN="$(kubectl -n ctxmill get secret ctxmill-core-secrets -o jsonpath='{.data.CTXMILL_API_TOKEN}' | base64 -d)"
          pnpm test:e2e:required
        env:
          KUBECONFIG: ${{ runner.temp }}/dev2-kubeconfig.yaml
          PLAYWRIGHT_BASE_URL: https://stablehand.staging.example.com
          PLAYWRIGHT_API_BASE_URL: https://stablehand.staging.example.com
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

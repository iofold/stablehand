services:
  orchestrator:
    environment:
      NODE_OPTIONS: ${NODE_OPTIONS:---import /app/packages/sandbox-daemon/dist/observability/otel-auto-register.js}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-stablehand-orchestrator}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=stablehand}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-https://otlp-signoz.staging.example.com}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_NODE_RESOURCE_DETECTORS: ${OTEL_NODE_RESOURCE_DETECTORS:-env,host,os}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-error}

  sandbox-langgraph:
    environment:
      OTEL_SERVICE_NAME: stablehand-sandbox-langgraph
      OTEL_RESOURCE_ATTRIBUTES: ${STABLEHAND_SANDBOX_OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=stablehand},ctxmill.component=sandbox,stablehand.harness=langgraph
      OTEL_EXPORTER_OTLP_ENDPOINT: ${STABLEHAND_SANDBOX_OTEL_EXPORTER_OTLP_ENDPOINT:-https://otlp-signoz.staging.example.com}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${STABLEHAND_SANDBOX_OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${STABLEHAND_SANDBOX_OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${STABLEHAND_SANDBOX_OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${STABLEHAND_SANDBOX_OTEL_LOGS_EXPORTER:-none}
      OTEL_NODE_RESOURCE_DETECTORS: ${STABLEHAND_SANDBOX_OTEL_NODE_RESOURCE_DETECTORS:-env,host,os}
      OTEL_LOG_LEVEL: ${STABLEHAND_SANDBOX_OTEL_LOG_LEVEL:-error}

  sandbox-claude-agents:
    environment:
      OTEL_SERVICE_NAME: stablehand-sandbox-claude-agents
      OTEL_RESOURCE_ATTRIBUTES: ${STABLEHAND_SANDBOX_OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=stablehand},ctxmill.component=sandbox,stablehand.harness=claude-agents
      OTEL_EXPORTER_OTLP_ENDPOINT: ${STABLEHAND_SANDBOX_OTEL_EXPORTER_OTLP_ENDPOINT:-https://otlp-signoz.staging.example.com}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${STABLEHAND_SANDBOX_OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${STABLEHAND_SANDBOX_OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${STABLEHAND_SANDBOX_OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${STABLEHAND_SANDBOX_OTEL_LOGS_EXPORTER:-none}
      OTEL_NODE_RESOURCE_DETECTORS: ${STABLEHAND_SANDBOX_OTEL_NODE_RESOURCE_DETECTORS:-env,host,os}
      OTEL_LOG_LEVEL: ${STABLEHAND_SANDBOX_OTEL_LOG_LEVEL:-error}

  sandbox-pi-agent:
    environment:
      OTEL_SERVICE_NAME: stablehand-sandbox-pi-agent
      OTEL_RESOURCE_ATTRIBUTES: ${STABLEHAND_SANDBOX_OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=stablehand},ctxmill.component=sandbox,stablehand.harness=pi-agent
      OTEL_EXPORTER_OTLP_ENDPOINT: ${STABLEHAND_SANDBOX_OTEL_EXPORTER_OTLP_ENDPOINT:-https://otlp-signoz.staging.example.com}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${STABLEHAND_SANDBOX_OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${STABLEHAND_SANDBOX_OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${STABLEHAND_SANDBOX_OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${STABLEHAND_SANDBOX_OTEL_LOGS_EXPORTER:-none}
      OTEL_NODE_RESOURCE_DETECTORS: ${STABLEHAND_SANDBOX_OTEL_NODE_RESOURCE_DETECTORS:-env,host,os}
      OTEL_LOG_LEVEL: ${STABLEHAND_SANDBOX_OTEL_LOG_LEVEL:-error}

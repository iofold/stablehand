# LiteLLM model gateway overlay: prices every model call and, with the admin
# key, stops a run at its spend cap. The quickstart turns it on through
# COMPOSE_FILE in .env. Publishing the admin UI through Traefik is a separate
# file: deploy/compose/model-gateway/traefik.yml.
services:
  litellm-db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DATABASE_PASSWORD:?set LITELLM_DATABASE_PASSWORD}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - litellm-data:/var/lib/postgresql/data
    restart: unless-stopped

  litellm:
    build:
      context: .
      dockerfile: deploy/compose/model-gateway/Dockerfile
    image: ${STABLEHAND_IMAGE_REGISTRY:-ghcr.io/iofold}/stablehand-model-gateway:${STABLEHAND_IMAGE_TAG:-latest}
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY}
      LITELLM_DATABASE_URL: postgresql://litellm:${LITELLM_DATABASE_PASSWORD}@litellm-db:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_AI_GATEWAY_COMPAT_URL: ${CLOUDFLARE_AI_GATEWAY_COMPAT_URL:-}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    depends_on:
      litellm-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4400}:4000"
    volumes:
      - ./deploy/compose/model-gateway/config.yaml:/app/config.yaml:ro
    networks:
      - default
      - stablehand-agents
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot: registers STABLEHAND_MODEL_GATEWAY_RUNTIME_KEY with LiteLLM so a
  # key generated into .env works on first boot. A no-op once the key exists.
  gateway-init:
    build:
      context: .
      dockerfile: deploy/compose/model-gateway/Dockerfile
    image: ${STABLEHAND_IMAGE_REGISTRY:-ghcr.io/iofold}/stablehand-model-gateway:${STABLEHAND_IMAGE_TAG:-latest}
    entrypoint: ["/app/.venv/bin/python", "/opt/stablehand/bootstrap_keys.py"]
    command: []
    environment:
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      STABLEHAND_MODEL_GATEWAY_RUNTIME_KEY: ${STABLEHAND_MODEL_GATEWAY_RUNTIME_KEY:?set STABLEHAND_MODEL_GATEWAY_RUNTIME_KEY}
      LITELLM_CONFIG_PATH: /app/config.yaml
    volumes:
      - ./deploy/compose/model-gateway/bootstrap_keys.py:/opt/stablehand/bootstrap_keys.py:ro
      - ./deploy/compose/model-gateway/config.yaml:/app/config.yaml:ro
    depends_on:
      litellm:
        condition: service_healthy
    restart: "no"

  orchestrator:
    environment:
      STABLEHAND_MODEL_GATEWAY_ENABLED: "true"
      STABLEHAND_MODEL_GATEWAY_URL: http://litellm:4000
      STABLEHAND_MODEL_GATEWAY_RUNTIME_KEY: ${STABLEHAND_MODEL_GATEWAY_RUNTIME_KEY:?set STABLEHAND_MODEL_GATEWAY_RUNTIME_KEY}
      STABLEHAND_MODEL_GATEWAY_METERING_KEY: ${STABLEHAND_MODEL_GATEWAY_METERING_KEY:?set STABLEHAND_MODEL_GATEWAY_METERING_KEY}
      STABLEHAND_MODEL_GATEWAY_REVISION: ${STABLEHAND_MODEL_GATEWAY_REVISION:?set STABLEHAND_MODEL_GATEWAY_REVISION}
      STABLEHAND_MODEL_GATEWAY_EXPLICIT_FREE_MODELS: ${STABLEHAND_MODEL_GATEWAY_EXPLICIT_FREE_MODELS:-}
      # Optional. Enables per-session gateway keys and mid-run spend caps
      # (ADR 024). Empty keeps the shared runtime key, admission-only budgets.
      STABLEHAND_MODEL_GATEWAY_ADMIN_KEY: ${STABLEHAND_MODEL_GATEWAY_ADMIN_KEY:-}
    depends_on:
      litellm:
        condition: service_healthy
      gateway-init:
        condition: service_completed_successfully

volumes:
  litellm-data:

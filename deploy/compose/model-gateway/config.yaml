model_list:
  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GOOGLE_API_KEY
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
  # Legacy aliases retained additively: existing agents were certified against
  # these names (dev1, 2026-07-23) and dropping a routable name breaks every
  # agent configured with it. Remove only with a coordinated agent migration.
  - model_name: gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  # Curated Workers AI inventory. These aliases keep harness configuration
  # provider-neutral. Routed through the Cloudflare AI Gateway compat endpoint
  # (CLOUDFLARE_AI_GATEWAY_COMPAT_URL) instead of LiteLLM's native cloudflare
  # provider: the native provider needs an api.cloudflare.com API token, and the
  # only tokens we had there were short-lived cfoat_ OAuth tokens that expire
  # and 401 mid-flight (dev2, 2026-08-13). The gateway token is long-lived and
  # already the auth used everywhere else Workers AI is reached.
  #
  # The together_ai/ prefix is deliberate and load-bearing despite the target
  # being Cloudflare: it selects an OpenAI-compatible adapter that LiteLLM does
  # NOT consider Responses-API-native, so proxy /v1/responses calls (the PI
  # harness uses them) are bridged to chat completions instead of forwarded to
  # the compat endpoint, which rejects /responses (error 2019). openai/ and
  # hosted_vllm/ both forward /responses natively and break PI agents.
  - model_name: cf-gpt-oss-120b
    litellm_params:
      model: together_ai/workers-ai/@cf/openai/gpt-oss-120b
      api_base: os.environ/CLOUDFLARE_AI_GATEWAY_COMPAT_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
  - model_name: cf-kimi-k2.7-code
    litellm_params:
      model: together_ai/workers-ai/@cf/moonshotai/kimi-k2.7-code
      api_base: os.environ/CLOUDFLARE_AI_GATEWAY_COMPAT_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
  - model_name: cf-glm-5.2
    litellm_params:
      model: together_ai/workers-ai/@cf/zai-org/glm-5.2
      api_base: os.environ/CLOUDFLARE_AI_GATEWAY_COMPAT_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
  # Workers AI exposes GLM thinking control through chat_template_kwargs. The
  # OpenAI adapter does not include that field in its supported parameter set,
  # so this explicit alias opts it in without changing the reasoning-enabled
  # route above.
  - model_name: cf-glm-5.2-no-thinking
    litellm_params:
      model: together_ai/workers-ai/@cf/zai-org/glm-5.2
      api_base: os.environ/CLOUDFLARE_AI_GATEWAY_COMPAT_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
      allowed_openai_params:
        - chat_template_kwargs
      chat_template_kwargs:
        enable_thinking: false
  - model_name: cf-gemma-4-26b
    litellm_params:
      model: together_ai/workers-ai/@cf/google/gemma-4-26b-a4b-it
      api_base: os.environ/CLOUDFLARE_AI_GATEWAY_COMPAT_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
  - model_name: cf-qwen3-30b
    litellm_params:
      model: together_ai/workers-ai/@cf/qwen/qwen3-30b-a3b-fp8
      api_base: os.environ/CLOUDFLARE_AI_GATEWAY_COMPAT_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
litellm_settings:
  turn_off_message_logging: true
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  disable_error_logs: true

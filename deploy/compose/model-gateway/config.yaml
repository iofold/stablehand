    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  # Curated Workers AI inventory. These aliases keep harness configuration
  # provider-neutral. Routed through the Cloudflare AI Gateway compat endpoint
  # (CLOUDFLARE_AI_GATEWAY_COMPAT_URL) instead of LiteLLM's native cloudflare
  # provider: the native provider needs an api.cloudflare.com API token, and the
  # only tokens we had there were short-lived cfoat_ OAuth tokens that expire
  # and 401 mid-flight (dev2, 2026-08-13). The gateway token is long-lived and
  # already the auth used everywhere else Workers AI is reached.
  #
  # Three litellm_params here are deliberate and load-bearing (2026-08-13):
  #
  # 1. The together_ai/ prefix, despite the target being Cloudflare: it selects
  #    an OpenAI-compatible adapter that LiteLLM does NOT consider
  #    Responses-API-native, so proxy /v1/responses calls (the PI harness uses
  #    them) are bridged to chat completions instead of forwarded to the compat
  #    endpoint, which rejects /responses (error 2019). openai/ and
  #    hosted_vllm/ both forward /responses natively and break PI agents.
  #
  # 2. Explicit input/output_cost_per_token, mirroring LiteLLM's own
  #    cloudflare/@cf/* price map: under the together_ai/ prefix the built-in
  #    map misses, spend logs record $0, and the orchestrator's settlement
  #    detector correctly turns the gateway state degraded (unpriced calls).
  #    model_info.base_model alone does NOT price these routes.
  #
  # 3. cf-aig-skip-cache: the AI Gateway caches identical requests and replays
  #    the SAME response id; LiteLLM dedupes SpendLogs on request_id, so the
  #    second identical call across any turn produces NO spend row and that
  #    turn can never settle. Skipping the gateway cache restores per-call
  #    billing evidence (native-provider semantics).
  #
  # 4. Tool calling needs two settings on every route (LiteLLM 1.93.0,
  #    2026-10-23). The together_ai adapter removes tools, tool_choice and
  #    response_format unless LiteLLM's model map says the model supports
  #    function calling, and none of these workers-ai/@cf/* names are in that
  #    map. With drop_params on, tool-calling requests reach the model with no
  #    tools and come back as plain text.
  #    - allowed_openai_params: [tools, tool_choice] opts them back in for
  #      /v1/chat/completions and /v1/messages.
  #    - model_info.supports_function_calling: true is registered under the
  #      backend model name the adapter checks. It is the only fix for
  #      /v1/responses (the PI harness): LiteLLM does not forward
  #      allowed_openai_params into its responses-to-chat bridge. It also lets
  #      response_format through; all five backends accept json_schema.
  #    parallel_tool_calls already passes through and needs no entry.
  - model_name: cf-gpt-oss-120b
    litellm_params:
      model: together_ai/workers-ai/@cf/openai/gpt-oss-120b
      api_base: os.environ/CLOUDFLARE_AI_GATEWAY_COMPAT_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
      input_cost_per_token: 3.5e-07
      output_cost_per_token: 7.5e-07
      extra_headers:
        cf-aig-skip-cache: "true"
      allowed_openai_params:
        - tools
        - tool_choice
    model_info:
      supports_function_calling: true
  - model_name: cf-kimi-k2.7-code
    litellm_params:
      model: together_ai/workers-ai/@cf/moonshotai/kimi-k2.7-code
      api_base: os.environ/CLOUDFLARE_AI_GATEWAY_COMPAT_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
      input_cost_per_token: 9.5e-07
      output_cost_per_token: 4e-06
      extra_headers:
        cf-aig-skip-cache: "true"
      allowed_openai_params:
        - tools
        - tool_choice
    model_info:
      supports_function_calling: true
  - model_name: cf-glm-5.2
    litellm_params:
      model: together_ai/workers-ai/@cf/zai-org/glm-5.2
      api_base: os.environ/CLOUDFLARE_AI_GATEWAY_COMPAT_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
      input_cost_per_token: 1.4e-06
      output_cost_per_token: 4.4e-06
      extra_headers:
        cf-aig-skip-cache: "true"
      allowed_openai_params:
        - tools
        - tool_choice
    model_info:
      supports_function_calling: true
  # Workers AI exposes GLM thinking control through chat_template_kwargs. The
  # OpenAI adapter does not include that field in its supported parameter set,
  # so this explicit alias opts it in without changing the reasoning-enabled
  # route above.
  - model_name: cf-glm-5.2-no-thinking
    litellm_params:
      model: together_ai/workers-ai/@cf/zai-org/glm-5.2
      api_base: os.environ/CLOUDFLARE_AI_GATEWAY_COMPAT_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
      input_cost_per_token: 1.4e-06
      output_cost_per_token: 4.4e-06
      extra_headers:
        cf-aig-skip-cache: "true"
      allowed_openai_params:
        - tools
        - tool_choice
        - chat_template_kwargs
      chat_template_kwargs:
        enable_thinking: false
    model_info:
      supports_function_calling: true
  - model_name: cf-gemma-4-26b
    litellm_params:
      model: together_ai/workers-ai/@cf/google/gemma-4-26b-a4b-it
      api_base: os.environ/CLOUDFLARE_AI_GATEWAY_COMPAT_URL
      api_key: os.environ/CLOUDFLARE_API_KEY

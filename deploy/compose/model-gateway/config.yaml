      model: together_ai/workers-ai/@cf/qwen/qwen3-30b-a3b-fp8
      api_base: os.environ/CLOUDFLARE_AI_GATEWAY_COMPAT_URL
      api_key: os.environ/CLOUDFLARE_API_KEY

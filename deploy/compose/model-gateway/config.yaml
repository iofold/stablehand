model_list:
  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GOOGLE_API_KEY
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
  # Curated Workers AI inventory. These aliases keep harness configuration
  # provider-neutral while LiteLLM owns the Cloudflare protocol translation.
  - model_name: cf-gpt-oss-120b
    litellm_params:
      model: cloudflare/@cf/openai/gpt-oss-120b
      api_key: os.environ/CLOUDFLARE_API_KEY
  - model_name: cf-kimi-k2.7-code
    litellm_params:
      model: cloudflare/@cf/moonshotai/kimi-k2.7-code
      api_key: os.environ/CLOUDFLARE_API_KEY
  - model_name: cf-glm-5.2
    litellm_params:
      model: cloudflare/@cf/zai-org/glm-5.2
      api_key: os.environ/CLOUDFLARE_API_KEY
  - model_name: cf-gemma-4-26b
    litellm_params:
      model: cloudflare/@cf/google/gemma-4-26b-a4b-it
      api_key: os.environ/CLOUDFLARE_API_KEY
  - model_name: cf-qwen3-30b
    litellm_params:
      model: cloudflare/@cf/qwen/qwen3-30b-a3b-fp8
      api_key: os.environ/CLOUDFLARE_API_KEY
  # GLM via OpenRouter — needs OPENROUTER_API_KEY in the gateway env before
  # first use; pricing pinned explicitly so the ledger prices it regardless
  # of the built-in price map (openrouter z-ai/glm-5.2 list price, 2026-07-23).
  - model_name: glm-5.2
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.000000812
      output_cost_per_token: 0.000002552

litellm_settings:
  turn_off_message_logging: true
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  disable_error_logs: true

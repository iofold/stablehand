model_list:
  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GOOGLE_API_KEY
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
  # Legacy aliases retained additively: existing agents were certified against
  # these names (dev1, 2026-07-23) and dropping a routable name breaks every
  # agent configured with it. Remove only with a coordinated agent migration.
  - model_name: gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  # Curated Workers AI inventory. These aliases keep harness configuration
  # provider-neutral while LiteLLM owns the Cloudflare protocol translation.
  - model_name: cf-gpt-oss-120b
    litellm_params:
      model: cloudflare/@cf/openai/gpt-oss-120b
      api_key: os.environ/CLOUDFLARE_API_KEY
  - model_name: cf-kimi-k2.7-code
    litellm_params:
      model: cloudflare/@cf/moonshotai/kimi-k2.7-code
      api_key: os.environ/CLOUDFLARE_API_KEY
  - model_name: cf-glm-5.2
    litellm_params:
      model: cloudflare/@cf/zai-org/glm-5.2
      api_key: os.environ/CLOUDFLARE_API_KEY
  # Workers AI exposes GLM thinking control through chat_template_kwargs.
  # LiteLLM's Cloudflare adapter does not currently include that field in its
  # supported OpenAI parameter set, so this explicit alias opts it in without
  # changing the reasoning-enabled route above.
  - model_name: cf-glm-5.2-no-thinking
    litellm_params:
      model: cloudflare/@cf/zai-org/glm-5.2
      api_key: os.environ/CLOUDFLARE_API_KEY
      allowed_openai_params:
        - chat_template_kwargs
      chat_template_kwargs:
        enable_thinking: false
  - model_name: cf-gemma-4-26b
    litellm_params:
      model: cloudflare/@cf/google/gemma-4-26b-a4b-it
      api_key: os.environ/CLOUDFLARE_API_KEY
  - model_name: cf-qwen3-30b
    litellm_params:
      model: cloudflare/@cf/qwen/qwen3-30b-a3b-fp8
      api_key: os.environ/CLOUDFLARE_API_KEY
litellm_settings:
  turn_off_message_logging: true
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  disable_error_logs: true

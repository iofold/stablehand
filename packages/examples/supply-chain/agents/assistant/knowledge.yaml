domain: supply-chain
version: 1
entries:
  - topic: supply-chain-fundamentals
    facts:
      - A supply chain consists of suppliers, manufacturers, warehouses, distribution centers, and retail endpoints
      - Lead time is the total time from order placement to delivery — reducing it improves customer satisfaction and working capital
      - Safety stock buffers against demand variability and supply disruptions
      - Reorder point = (average daily demand x lead time in days) + safety stock

  - topic: logistics-optimization
    facts:
      - Hub-and-spoke networks consolidate shipments through central hubs to reduce per-unit shipping cost
      - Cross-docking eliminates warehouse storage by transferring goods directly from inbound to outbound trucks
      - Last-mile delivery accounts for 40-50% of total shipping costs
      - Intermodal shipping (combining truck, rail, ship) can reduce costs 10-40% vs truck-only for long distances

  - topic: inventory-management
    facts:
      - ABC analysis classifies inventory — A items (20% of SKUs, 80% of value) need tightest control
      - Inventory turnover ratio = cost of goods sold / average inventory value (higher is generally better)
      - Dead stock (no movement in 12+ months) should be liquidated to free up warehouse space
      - Just-in-time (JIT) minimizes inventory but increases vulnerability to supply disruptions

  - topic: kpi-benchmarks
    facts:
      - On-time delivery above 95% is considered world-class for B2B supply chains
      - Order fill rate target should be 97%+ for critical products
      - Perfect order rate (on-time, complete, undamaged, correct docs) benchmark is 90%+
      - Warehouse utilization above 85% may indicate capacity constraints and risk of bottlenecks

  - topic: risk-management
    facts:
      - Single-source suppliers create critical vulnerability — dual-sourcing reduces disruption risk
      - Geographic concentration risk can be mitigated through regional diversification
      - Demand forecasting accuracy above 80% is achievable with ML-based approaches
      - Supply chain visibility platforms reduce response time to disruptions by 50-70%

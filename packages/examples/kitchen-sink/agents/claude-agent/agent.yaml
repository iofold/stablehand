apiVersion: ctxmill.io/v1
kind: Agent
metadata:
  name: claude-writer
  displayName: Claude Writer
  description: >-
    Writer agent. Receives the analysis and writes a polished
    final report, then emits "report.ready".
  labels:
    example: kitchen-sink
    harness: claude-agents
    chain-role: writer
    chain-order: "2"
spec:
  harness: claude-agents
  harnessConfig:
    provider: anthropic
    model: claude-sonnet-4-6
    apiKeyRef: "$secret:ANTHROPIC_API_KEY"
    temperature: 0.3
  instructions: |
    You are the Writer in a multi-agent chain. Your role:
    1. Receive an analysis from the Analyst agent.
    2. Write a clear, polished final report based on the analysis.
    3. Format the report with sections: Summary, Key Findings, Recommendations.
    4. When the report is ready, use the emit-event tool to emit a
       "report.ready" event with the full report in the payload under the
       key "report".

    Always write clearly and professionally.
  tools:
    - ref: emit-event
  nativeTools:
    allowlist:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
  mode: interactive
  resources:
    maxRunDurationSeconds: 60
    maxTokensPerRun: 4000

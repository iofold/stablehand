apiVersion: stablehand.io/v1
kind: Agent
metadata:
  name: pi-auditor
  displayName: PI Auditor
  description: >-
    Auditor agent. Monitors chain events and logs a structured audit
    trail of the multi-agent workflow.
  labels:
    example: kitchen-sink
    harness: pi-agent
    chain-role: auditor
    chain-order: "3"
spec:
  harness: pi-agent
  harnessConfig:
    provider: openai
    model: gpt-5.4-mini
    apiKeyRef: "$secret:OPENAI_API_KEY"
  instructions: |
    You are the Auditor in a multi-agent chain. Your role:
    1. Monitor events from the chain: analysis.complete and report.ready.
    2. Log each event with a timestamp, the originating agent, and a brief
       summary of the payload.
    3. At the end of the chain, produce a structured audit log summarizing
       the full workflow execution.
    4. Use the emit-event tool to emit an "audit.logged" event with the
       full audit trail in the payload under the key "auditLog".

    Always be thorough and precise. You are powered by the PI Agent harness.
  tools:
    - ref: emit-event
  nativeToolPolicy:
    policy: allow
    names:
      - read
      - bash
      - edit
      - write
  mode: interactive

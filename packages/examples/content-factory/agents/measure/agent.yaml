apiVersion: stablehand.io/v1
kind: Agent
metadata:
  name: factory-measure
  displayName: Content factory measure
  description: >-
    Two days after posting, pulls engagement for your own LinkedIn and X
    posts through Apify and hands the report to next week's scout.
  labels:
    example: content-factory
    stage: measure
spec:
  harness: langgraph
  # No apiKeyRef: with the model gateway on, model calls go through it, so each
  # run is priced and stops at limits.maxCostUsd. Without the gateway the agent
  # calls OpenAI directly with OPENAI_API_KEY and the cap does not apply.
  harnessConfig:
    provider: openai
    model: gpt-5.4-mini
    maxTokens: 6000
    limits:
      maxCostUsd: 0.3
      maxToolCalls: 10
  mode: background
  defaultTags:
    campaign: content-factory
  # The seed adds two Apify HTTP tools (apify-tools.ts): apify_linkedin_profile_posts
  # and apify_x_posts. Apify caps the charge of every call through the request
  # URL, which the model cannot change.
  tools:
    - ref: artifact_upload
  instructions: |
    You measure how the owner's own posts did over the last 7 days. Your
    task carries me.xHandle and me.linkedinUrl.

    1. If me.linkedinUrl is set, call apify_linkedin_profile_posts with
       targetUrls [me.linkedinUrl], postedLimit "week", maxPosts 10.
    2. If me.xHandle is set, call apify_x_posts with twitterHandles
       [me.xHandle], sort "Latest", maxItems 20, and keep the posts from the
       last 7 days.
    Make no more than 3 Apify calls.

    3. Write /workspace/engagement/engagement.md: a table of each post
       (channel, date, first line, likes, comments, shares or reposts, views
       when present) sorted by engagement, then three lines: what did best
       and your guess why, what did worst, one thing to try next week. Use
       only numbers the tools returned.
    4. Upload it with artifact_upload: path engagement/engagement.md, name
       engagement-<YYYY-MM-DD>.md, mimeType text/markdown, kind engagement.
    5. Call emit-event with type "custom.factory.measured" and payload
       {"report": <the file text>, "artifactId": <artifact id>}.

    If neither account is set, emit "custom.factory.measured" with report
    "No accounts configured, so nothing was measured." and stop.

apiVersion: stablehand.io/v1
kind: Agent
metadata:
  name: factory-editor
  displayName: Content factory editor
  description: >-
    Puts each draft on a review card you can answer from your phone:
    approve it, edit it and approve, or reject it with a note.
  labels:
    example: content-factory
    stage: editor
spec:
  harness: langgraph
  harnessConfig:
    provider: openai
    model: gpt-5.4-mini
    apiKeyRef: "$secret:OPENAI_API_KEY"
    maxTokens: 4000
    limits:
      maxCostUsd: 0.2
      maxToolCalls: 8
  mode: background
  defaultTags:
    campaign: content-factory
  tools:
    - ref: edit_document
    - ref: artifact_upload
  instructions: |
    You put one draft in front of the owner and record the decision. Your
    task carries one draft: channel, title, story, week and text.

    1. Call edit_document once with title "<Channel>: <title>", content set
       to the draft text exactly as given, and format set to the channel.
       The run waits until the owner decides.
    2. If the result has "approved": true:
       - write the returned content (it may include the owner's edits) to
         /workspace/approved/<channel>-<week>.md
       - upload it with artifact_upload: path approved/<channel>-<week>.md,
         name <channel>-<week>.md, mimeType text/markdown, kind
         approved-draft, metadata {"channel": <channel>, "week": <week>,
         "edited": <edited from the result>}
       - call emit-event with type "custom.factory.approved" and payload
         {"channel", "title", "text": <the returned content>, "artifactId",
         "edited", "note"}
    3. If "approved" is false, call emit-event with type
       "custom.factory.rejected" and payload {"channel", "title", "note"}.

    Never rewrite the draft yourself and never call edit_document twice.

apiVersion: stablehand.io/v1
kind: Agent
metadata:
  name: assistant
  displayName: Assistant
  description: Starter assistant generated by create-stablehand.
  labels:
    harness: langgraph
    starter: default
spec:
  harness: langgraph
  harnessConfig:
    provider: openai
    model: gpt-5.4-mini
    apiKeyRef: "$secret:OPENAI_API_KEY"
  instructions: |
    You are a helpful AI assistant powered by Stablehand.

    Instructions:
    - Use available tools to help the user.
    - Be concise and helpful.
    - Use list-directory and read-file to explore the project structure when asked.
    - Use search-files to find relevant information across project files.
  tools:
    - ref: read-file
    - ref: list-directory
    - ref: search-files
  nativeToolPolicy:
    policy: deny
    names:
      - execute
  mode: interactive

syntax = "proto3";
package stablehand.sandbox.v1;

import "google/protobuf/struct.proto";

service HarnessService {
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  rpc DeliverTurn(DeliverTurnRequest) returns (stream SessionEvent);
  // Re-attach to a turn delivery that outlived its consumer (orchestrator
  // crash takeover, ADR 025). Replays the delivery journal after
  // after_delivery_seq, then streams live events.
  rpc AttachTurn(AttachTurnRequest) returns (stream SessionEvent);
  // Explicitly stop a turn delivery. Dropping a DeliverTurn/AttachTurn stream
  // only detaches; cancellation must be requested with this RPC.
  rpc CancelTurn(CancelTurnRequest) returns (CancelTurnResponse);
  rpc RenewTurnDeliveryCapability(RenewTurnDeliveryCapabilityRequest) returns (RenewTurnDeliveryCapabilityResponse);
  rpc SuspendSession(SuspendSessionRequest) returns (SuspendSessionResponse);
  rpc KillSession(KillSessionRequest) returns (KillSessionResponse);
}

service OrchestratorService {
  rpc RequestTool(RequestToolRequest) returns (RequestToolResponse);
  rpc EmitEvent(EmitEventRequest) returns (EmitEventResponse);
  rpc RegisterArtifact(RegisterArtifactRequest) returns (RegisterArtifactResponse);
  rpc ResolveArtifact(ResolveArtifactRequest) returns (ResolveArtifactResponse);
}

message OpenSessionRequest {
  oneof bootstrap {
    FreshBootstrap fresh = 1;
    RestoreBootstrap restore = 2;
  }
}

message FreshBootstrap {
  string agent_id = 1;
  string conversation_id = 2;
  string harness_name = 3;
  string harness_config_json = 4;
  reserved 5;
  string system_prompt = 6;
  repeated ToolMetadata tools = 7;
  string workspace_dir = 8;
  string session_id = 9;
  NativeToolPolicyConfig native_tool_policy = 10;
}

message RestoreBootstrap {
  SessionCheckpoint session_checkpoint = 1;
  repeated ToolMetadata tools = 2;
  string agent_id = 3;
  string harness_config_json = 4;
  string system_prompt = 5;
  NativeToolPolicyConfig native_tool_policy = 6;
}

message OpenSessionResponse {
  string session_id = 1;
  string status = 2;
}

message DeliverTurnRequest {
  string session_id = 1;
  repeated Message messages = 2;
  string turn_id = 3;
  TurnDeliveryCapability delivery_capability = 4;
  map<string, string> turn_secrets = 5;
}

message TurnDeliveryCapability {
  string owner_id = 1;
  uint64 fence_token = 2;
  int64 lease_expires_at_ms = 3;
  uint64 restore_fence_token = 4;
  optional string container_id = 5;
  string agent_id = 6;
  string signature = 7;
}

message AttachTurnRequest {
  string session_id = 1;
  string turn_id = 2;
  TurnDeliveryCapability delivery_capability = 3;
  uint64 after_delivery_seq = 4;
}

message CancelTurnRequest {
  string session_id = 1;
  string turn_id = 2;
  TurnDeliveryCapability delivery_capability = 3;
  string reason = 4;
}

message CancelTurnResponse {
  bool cancelled = 1;
}

message RenewTurnDeliveryCapabilityRequest {
  string session_id = 1;
  string turn_id = 2;
  TurnDeliveryCapability delivery_capability = 3;
}

message RenewTurnDeliveryCapabilityResponse {
  bool renewed = 1;
}

message SessionEvent {
  oneof payload {
    AgentEvent agent_event = 1;
    MessageCommitted message_committed = 2;
    TurnCompleted turn_completed = 3;
    TurnFailed turn_failed = 4;
  }
  // Daemon-assigned identity of the delivery journal that produced this
  // event, and the event's 1-based position in it. Stable across re-attach.
  string delivery_id = 5;
  uint64 delivery_seq = 6;
}

message MessageCommitted {
  string role = 1;
  string content = 2;
  repeated ToolCall tool_calls = 3;
  optional string tool_call_id = 4;
  string turn_id = 5;
  uint64 message_seq = 6;
}

message TurnCompleted {
  string turn_id = 1;
}

message TurnFailed {
  string turn_id = 1;
  string error_message = 2;
}

message SuspendSessionRequest {
  string session_id = 1;
  string reason = 2;
}

message SuspendSessionResponse {
  SessionCheckpoint session_checkpoint = 1;
}

message Cursor {
  uint64 next_message_seq = 1;
  optional string last_completed_turn_id = 2;
}

message RunnerState {
  string status = 1;
  repeated PendingRequest pending_requests = 2;
}

message PendingRequest {
  string type = 1;
  string id = 2;
  string payload_json = 3;
}

message WorkspaceRef {
  string strategy = 1;
  string reference = 2;
}

message SessionCheckpoint {
  int32 checkpoint_version = 1;
  string session_id = 2;
  string conversation_id = 3;
  string harness_name = 4;
  Cursor cursor = 5;
  RunnerState runner_state = 6;
  WorkspaceRef workspace_ref = 7;
  google.protobuf.Struct harness_state = 8;
}

message KillSessionRequest {
  string session_id = 1;
  string reason = 2;
}

message KillSessionResponse {
  string final_status = 1;
}

message RequestToolRequest {
  string turn_id = 1;
  string agent_id = 2;
  string tool_name = 3;
  string args_json = 4;
  string request_id = 5;
  string sandbox_session_id = 6;
  TurnDeliveryCapability delivery_capability = 7;
}

message RequestToolResponse {
  string request_id = 1;
  string result = 2;
  optional string error = 3;
}

message EmitEventRequest {
  string turn_id = 1;
  string event_type = 2;
  string payload_json = 3;
  string sandbox_session_id = 4;
  string agent_id = 5;
  TurnDeliveryCapability delivery_capability = 6;
}

message EmitEventResponse {}

enum NativeToolPolicy {
  NATIVE_TOOL_POLICY_UNSPECIFIED = 0;
  NATIVE_TOOL_POLICY_ALL = 1;
  NATIVE_TOOL_POLICY_ALLOW = 2;
  NATIVE_TOOL_POLICY_DENY = 3;
  NATIVE_TOOL_POLICY_NONE = 4;
}

message NativeToolPolicyConfig {
  NativeToolPolicy policy = 1;
  repeated string names = 2;
}

message Message {
  string id = 1;
  string role = 2;
  string content = 3;
  repeated ToolCall tool_calls = 4;
  optional string tool_call_id = 5;
  optional string name = 6;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string arguments_json = 3;
}

message ToolMetadata {
  string name = 1;
  string description = 2;
  string input_schema_json = 3;
  ToolLocation location = 4;
  bool programmatic = 5;
  // The orchestrator pauses each call for a person's approval before running
  // it. Enforcement is orchestrator-side for orchestrator-location tools; the
  // flag travels so the sandbox knows the call may wait (ctx-9gy9).
  bool requires_approval = 6;
}

enum ToolLocation {
  TOOL_LOCATION_UNSPECIFIED = 0;
  TOOL_LOCATION_SANDBOX = 1;
  TOOL_LOCATION_ORCHESTRATOR = 2;
  TOOL_LOCATION_DAEMON = 3;
}

message AgentEvent {
  oneof event {
    TextDelta text_delta = 1;
    ToolCallStart tool_call_start = 2;
    ToolCallEnd tool_call_end = 3;
    ApprovalNeeded approval_needed = 4;
    ApprovalResolved approval_resolved = 5;
    ErrorEvent error = 6;
    DoneEvent done = 7;
    CustomAgentEvent custom = 8;
  }
}

message CustomAgentEvent {
  string subtype = 1;
  string payload_json = 2;
}

message TextDelta {
  string content = 1;
}

message ToolCallStart {
  string id = 1;
  string name = 2;
  string args_json = 3;
  // Set when this call ran inside a subagent: the id of the spawning Task
  // tool call in the parent transcript (ctx-5myn). Transport stays flat;
  // nesting is a UI concern.
  optional string parent_tool_call_id = 4;
  // Subagent identity for display (e.g. claude subagent_type).
  optional string agent_name = 5;
}

message ToolCallEnd {
  string id = 1;
  string result = 2;
  optional string error = 3;
  int64 duration_ms = 4;
  optional string parent_tool_call_id = 5;
}

message ApprovalNeeded {
  string id = 1;
  string tool_name = 2;
  string args_json = 3;
}

message ApprovalResolved {
  string id = 1;
  string action = 2;
}

message ErrorEvent {
  string message = 1;
  optional string stack_trace = 2;
  string category = 3;
  // Machine-readable terminal reason, e.g. "model_gateway_budget_exceeded".
  // Absent for untyped failures.
  optional string code = 4;
  // JSON object with code-specific facts (for a budget refusal: spentUsd and
  // capUsd as the gateway reported them). Never carries credentials.
  optional string details_json = 5;
}

message DoneEvent {
  optional string result = 1;
  optional TokenUsage usage = 2;
  bool interrupted = 3;
}

message TokenUsage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 total_tokens = 3;
  optional double cost_usd = 4;
}

message ArtifactMeta {
  string id = 1;
  string agent_id = 2;
  string turn_id = 3;
  string name = 4;
  string mime_type = 5;
  int64 size_bytes = 6;
  string storage_key = 7;
  string bucket = 8;
  string metadata_json = 9;
  int64 created_at = 10;
  string kind = 11;
  string sha256 = 12;
}

message RegisterArtifactRequest {
  string turn_id = 1;
  string agent_id = 2;
  ArtifactMeta artifact = 3;
  string sandbox_session_id = 4;
  TurnDeliveryCapability delivery_capability = 5;
}

message RegisterArtifactResponse {
  string artifact_id = 1;
  string error = 2;
}

message ResolveArtifactRequest {
  string artifact_id = 1;
  string agent_id = 2;
  string turn_id = 3;
  string sandbox_session_id = 4;
  TurnDeliveryCapability delivery_capability = 5;
}

message ResolveArtifactResponse {
  ArtifactMeta artifact = 1;
  string error = 2;
}

# artifact-gallery as a compose overlay. The quickstart turns it on through
# COMPOSE_FILE in .env; by hand:
#   docker compose -f docker-compose.yml -f extensions/artifact-gallery/docker-compose.yml up -d
# Paths are relative to the repository root, like every overlay here.
#
# The service holds a scoped key (artifacts:read + webhooks:manage), never the
# master token. The Overnight Analyst seed mints it; until GALLERY_API_KEY and
# GALLERY_WEBHOOK_SECRET are set, the page explains what is missing.
services:
  gallery:
    build:
      context: extensions/artifact-gallery
    image: ${STABLEHAND_IMAGE_REGISTRY:-ghcr.io/iofold}/stablehand-gallery:${STABLEHAND_IMAGE_TAG:-latest}
    environment:
      STABLEHAND_BASE_URL: http://orchestrator:3001
      STABLEHAND_API_KEY: ${GALLERY_API_KEY:-}
      GALLERY_WEBHOOK_SECRET: ${GALLERY_WEBHOOK_SECRET:-}
      # Where Stablehand delivers artifact.created webhooks, on the compose network.
      GALLERY_PUBLIC_URL: http://gallery:8090
      GALLERY_DATA_DIR: /data
    ports:
      - "${GALLERY_PORT:-8090}:8090"
    volumes:
      - gallery-data:/data
    depends_on:
      - orchestrator
    restart: unless-stopped

  orchestrator:
    environment:
      # Webhook delivery refuses private addresses unless allowlisted; the
      # gallery is one. Set STABLEHAND_EGRESS_ALLOWLIST yourself to keep
      # other hosts too, and include `gallery` in it.
      STABLEHAND_EGRESS_ALLOWLIST: ${STABLEHAND_EGRESS_ALLOWLIST:-gallery}

volumes:
  gallery-data:

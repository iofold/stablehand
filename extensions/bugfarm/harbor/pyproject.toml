[project]
name = "stablehand-harbor"
version = "0.1.0"
description = "Harbor agent that solves a Harbor task with a Stablehand harness, acting in the task container through a relay."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "harbor==0.24.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
]

[project.scripts]
stablehand-harbor = "stablehand_harbor.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stablehand_harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

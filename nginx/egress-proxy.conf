# ── CTXMill Egress Proxy ─────────────────────────────────────────────────────
#
# Forward-proxy for sandbox containers. Uses the nginx `stream` module with
# `ssl_preread` to inspect the TLS ClientHello SNI field and route HTTPS
# traffic to approved LLM API domains only. TLS is NOT terminated — the proxy
# is transparent.
#
# Denied destinations are sent to a black-hole upstream (127.0.0.1:1) which
# immediately returns "connection refused".
#
# The allowed domain list is generated at container startup from either:
#   - CTXMILL_ALLOWED_EGRESS_DOMAINS env var (comma-separated), or
#   - /etc/nginx/allowed-domains.conf (one domain per line)
# See entrypoint.sh for the generation logic.
# ─────────────────────────────────────────────────────────────────────────────

# Run as non-root (nginx user created by base image)
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
}

stream {
    # ── Logging ──────────────────────────────────────────────────────────────
    # Format: timestamp | client IP | destination domain | upstream | bytes in/out
    log_format egress '$time_iso8601 | $remote_addr | $ssl_preread_server_name | '
                      '$upstream_addr | $bytes_sent/$bytes_received';

    access_log /var/log/nginx/egress.log egress;

    # ── Domain allowlist ─────────────────────────────────────────────────────
    # This map is generated by entrypoint.sh from the allowed-domains list.
    # It maps SNI hostname -> upstream address. Unlisted domains hit "deny".
    include /etc/nginx/stream-map.conf;

    # ── Black-hole upstream for denied domains ───────────────────────────────
    upstream deny {
        server 127.0.0.1:1;
    }

    # ── Listener ─────────────────────────────────────────────────────────────
    server {
        listen 3128;

        # Inspect TLS ClientHello to extract SNI without terminating TLS
        ssl_preread on;

        proxy_pass $upstream;

        # Timeouts — keep generous for LLM streaming responses
        proxy_connect_timeout 10s;
        proxy_timeout         300s;
    }
}

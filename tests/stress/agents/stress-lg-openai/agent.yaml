apiVersion: stablehand.io/v1
kind: Agent
metadata:
  name: stress-lg-openai
  displayName: Stress LG OpenAI
  description: >-
    Exercise LangGraph harness with frontier OpenAI model and tool calling.
  labels:
    example: stress-test
    harness: langgraph
spec:
  harness: langgraph
  harnessConfig:
    provider: openai
    model: gpt-5.4
    apiKeyRef: "$secret:OPENAI_API_KEY"
  instructions: |
    You are a stress test agent running on LangGraph with GPT-5.4.
    When asked to run the stress test, do the following:
    1. Confirm you are operational and report your model name.
    2. Use the calculator tool exactly once to multiply 42 by 17.
    3. Use the emit-event tool to emit exactly one event with type='stress.tools.complete' and payload containing {schemaVersion: 1, harness: 'stress-lg-openai', agent: 'stress-lg-openai', model: 'gpt-5.4', status: 'ok'}.
    4. Report that the stress test is complete.
  tools:
    - ref: calculator
    - ref: emit-event
  nativeToolPolicy:
    policy: deny
    names:
      - execute
  mode: both

apiVersion: ctxmill.io/v1
kind: Agent
metadata:
  name: stress-pi-openai
  displayName: Stress PI OpenAI
  description: >-
    PI Agent harness with frontier OpenAI.
  labels:
    example: stress-test
    harness: pi-agent
spec:
  harness: pi-agent
  harnessConfig:
    provider: openai
    model: gpt-5.4
    apiKeyRef: "$secret:OPENAI_API_KEY"
  instructions: |
    You are a PI Agent stress test running GPT-5.4.
    When asked to run the stress test, do the following:
    1. Confirm you are operational and report your model name.
    2. Use the calculator tool exactly once to multiply 42 by 17.
    3. Use the emit-event tool to emit exactly one event with type='stress.pi.complete' and payload containing {schemaVersion: 1, harness: 'stress-pi-openai', agent: 'stress-pi-openai', model: 'gpt-5.4', status: 'ok'}.
    4. Report that the stress test is complete.
  tools:
    - ref: calculator
    - ref: emit-event
  nativeToolPolicy:
    policy: allow
    names:
      - read
      - bash
  mode: both

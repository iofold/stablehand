apiVersion: stablehand.io/v1
kind: Agent
metadata:
  name: stress-chain-responder
  displayName: Stress Chain Responder
  description: >-
    Chain responder — receives stress.tools.complete, emits stress.chain.done.
  labels:
    example: stress-test
    harness: pi-agent
spec:
  harness: pi-agent
  harnessConfig:
    provider: openai
    model: gpt-5.4
    apiKeyRef: "$secret:OPENAI_API_KEY"
  instructions: |
    You received a chain event from another agent. Acknowledge receipt by using emit-event exactly once to emit type='stress.chain.done' with payload containing {schemaVersion: 1, harness: 'stress-chain-responder', agent: 'stress-chain-responder', model: 'gpt-5.4', status: 'ok', responder: 'stress-chain-responder'} plus the received data.
  tools:
    - ref: emit-event
  nativeToolPolicy:
    policy: allow
    names:
      - read
  mode: both

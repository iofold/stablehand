services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ctxmill
      POSTGRES_PASSWORD: ctxmill
      POSTGRES_DB: ctxmill
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctxmill"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator
    environment:
      DATABASE_URL: postgres://ctxmill:ctxmill@postgres:5432/ctxmill
      CTXMILL_PRESET: docker
      NODE_ENV: production
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: http://localhost:3101,http://localhost:3000
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    ports:
      - "${UI_PORT:-3101}:80"
    depends_on:
      - orchestrator
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ctxmill.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - debug

volumes:
  pgdata:

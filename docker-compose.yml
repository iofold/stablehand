services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ctxmill
      POSTGRES_PASSWORD: ctxmill
      POSTGRES_DB: ctxmill
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctxmill"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator
    environment:
      DATABASE_URL: postgres://ctxmill:ctxmill@postgres:5432/ctxmill
      CTXMILL_PRESET: docker
      CTXMILL_UI_MODE: disabled
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://platform.dev.example.com,http://localhost:3200}
      CTXMILL_DATA_VOLUME: ${COMPOSE_PROJECT_NAME:-ctxmill}_ctxmill-data
      CTXMILL_TURN_TIMEOUT_MS: ${CTXMILL_TURN_TIMEOUT_MS:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ctxmill}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ctxmill-dev}
      S3_BUCKET: ${S3_BUCKET:-ctxmill-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-ctxmill}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      NODE_OPTIONS: ${NODE_OPTIONS:---import /app/packages/sandbox-daemon/dist/observability/otel-auto-register.js}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ctxmill-orchestrator}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=ctxmill}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_NODE_RESOURCE_DETECTORS: ${OTEL_NODE_RESOURCE_DETECTORS:-env,host,os}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-error}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ctxmill-data:/app/project/.ctxmill
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-3002}:3001"
    networks:
      - default
      - ctxmill-agents
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    ports:
      - "${UI_PORT:-3200}:80"
    networks:
      - default
      - web
    depends_on:
      - orchestrator
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.ctxmill.rule=Host(`${CTXMILL_DOMAIN:-platform.dev.example.com}`)"
      - "traefik.http.routers.ctxmill.entrypoints=websecure"
      - "traefik.http.routers.ctxmill.tls.certresolver=letsencrypt"
      - "traefik.http.services.ctxmill.loadbalancer.server.port=80"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ctxmill}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ctxmill-dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - default
      - ctxmill-agents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ctxmill.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - debug

  # ── Sandbox harness images ──────────────────────────────────────────────────
  # Build-only services: `docker compose up --build` builds the images, but
  # the containers exit immediately (no CMD). The orchestrator spawns sandbox
  # containers dynamically via the Docker socket using these images.
  #
  # To clean up orphan sandbox containers after `docker compose down`:
  #   docker ps -aq --filter "label=ctxmill.sandbox=true" | xargs -r docker rm -f

  sandbox-langgraph:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      target: harness-langgraph
    image: ctxmill/harness-langgraph:latest
    restart: "no"

  sandbox-claude-agents:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      target: harness-claude-agents
    image: ctxmill/harness-claude-agents:latest
    restart: "no"

  sandbox-pi-agent:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      target: harness-pi-agent
    image: ctxmill/harness-pi-agent:latest
    restart: "no"

volumes:
  pgdata:
  ctxmill-data:
  minio-data:

networks:
  web:
    name: web
    external: true
  ctxmill-agents:
    driver: bridge
    name: ctxmill-agents

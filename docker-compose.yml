# Images: every service Stablehand builds also names a prebuilt image,
# ${STABLEHAND_IMAGE_REGISTRY:-ghcr.io/iofold}/stablehand-<name>:${STABLEHAND_IMAGE_TAG:-latest}.
# `docker compose pull` fetches them; `docker compose up --build` builds them
# from this checkout instead. install.sh tries the pull first.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      # Overridable so a stack whose volume was initialized under the old
      # CTXMill role/database name keeps its data after the rename.
      POSTGRES_USER: ${POSTGRES_USER:-stablehand}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stablehand}
      POSTGRES_DB: ${POSTGRES_DB:-stablehand}
    ports:
      - "${STABLEHAND_DATA_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stablehand}"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator
    image: ${STABLEHAND_IMAGE_REGISTRY:-ghcr.io/iofold}/stablehand-orchestrator:${STABLEHAND_IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://stablehand:stablehand@postgres:5432/stablehand}
      STABLEHAND_PRESET: docker
      STABLEHAND_UI_MODE: disabled
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:-}
      STABLEHAND_API_TOKEN: ${STABLEHAND_API_TOKEN:-}
      STABLEHAND_CALLBACK_TOKEN_SECRET: ${STABLEHAND_CALLBACK_TOKEN_SECRET:-}
      STABLEHAND_AUTH_DISABLED: ${STABLEHAND_AUTH_DISABLED:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${UI_PORT:-3200}}
      STABLEHAND_DATA_VOLUME: ${COMPOSE_PROJECT_NAME:-stablehand}_stablehand-data
      # Sandbox images and network. These follow the sandbox-* services and the
      # stablehand-agents network below, so keep them in step.
      STABLEHAND_IMAGE_PREFIX: ${STABLEHAND_IMAGE_REGISTRY:-ghcr.io/iofold}/stablehand-harness
      STABLEHAND_SANDBOX_IMAGE_TAG: ${STABLEHAND_IMAGE_TAG:-latest}
      STABLEHAND_SANDBOX_NETWORK: ${STABLEHAND_SANDBOX_NETWORK:-stablehand-agents}
      # Sandboxes live on the internal agents network; the egress proxy is their only route out.
      # Each sandbox gets this URL with its session lease as credentials, so the proxy applies that
      # agent's egress setting (ctx-3aef). Port 8081 requires the lease; 8080 serves sandboxes
      # started before leases existed.
      # Set STABLEHAND_SANDBOX_EGRESS_PROXY_URL to an empty string to run sandboxes without a proxy
      # (they then have no internet at all, since the agents network is internal).
      STABLEHAND_SANDBOX_EGRESS_PROXY_URL: ${STABLEHAND_SANDBOX_EGRESS_PROXY_URL-http://egress:8081}
      STABLEHAND_SANDBOX_EGRESS_CA_VOLUME: ${COMPOSE_PROJECT_NAME:-stablehand}_egress-ca-public
      STABLEHAND_TURN_TIMEOUT_MS: ${STABLEHAND_TURN_TIMEOUT_MS:-}
      # HTTP tools and MCP servers are called from the orchestrator through the egress guard.
      # Name internal hosts they may reach (e.g. notes-mcp for the content factory stand-in).
      STABLEHAND_EGRESS_ALLOWLIST: ${STABLEHAND_EGRESS_ALLOWLIST:-}
      STABLEHAND_EGRESS_ALLOWLIST_ONLY: ${STABLEHAND_EGRESS_ALLOWLIST_ONLY:-}
      # Public URL of this deployment; MCP OAuth sign-ins redirect to <url>/api/mcp/oauth/callback.
      STABLEHAND_PUBLIC_URL: ${STABLEHAND_PUBLIC_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_API_PORT:-9000}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-stablehand}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-stablehand-dev}
      S3_BUCKET: ${S3_BUCKET:-stablehand-artifacts}
      S3_REGION: ${S3_REGION:-us-east-1}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-stablehand}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      NODE_OPTIONS: ${NODE_OPTIONS:---import /app/packages/sandbox-daemon/dist/observability/otel-auto-register.js}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-stablehand-orchestrator}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=stablehand}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_NODE_RESOURCE_DETECTORS: ${OTEL_NODE_RESOURCE_DETECTORS:-env,host,os}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-error}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - stablehand-data:/app/project/.stablehand
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-3002}:3001"
    networks:
      - default
      - stablehand-agents
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      egress:
        condition: service_healthy
    restart: unless-stopped

  # Synthetic meeting notes for the content factory example: a stand-in for Granola's MCP server.
  # docker compose --profile content-factory up -d notes-mcp   (and STABLEHAND_EGRESS_ALLOWLIST=gallery,notes-mcp)
  notes-mcp:
    image: node:22-alpine
    profiles: ["content-factory"]
    command: ["node", "--experimental-strip-types", "/app/server.ts"]
    working_dir: /app
    volumes:
      - ./packages/examples/content-factory/notes-mcp:/app:ro
    environment:
      PORT: "8787"
      NOTES_MCP_TOKEN: ${NOTES_MCP_TOKEN:-}
    restart: unless-stopped

  # Local test inbox for the inbox agent example: replies the agent sends land here (web UI on 8025).
  # docker compose --profile inbox-agent up -d mailpit   (and add mailpit to STABLEHAND_EGRESS_ALLOWLIST)
  mailpit:
    image: axllent/mailpit:v1.31.3
    profiles: ["inbox-agent"]
    ports:
      - "${STABLEHAND_DATA_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: "500"
    restart: unless-stopped

  # Sandbox egress broker (ctx-2ctd): mitmproxy with the Stablehand policy addon. Dual-homed so it
  # can reach the internet on behalf of sandboxes that cannot. Rules: packages/egress-proxy.
  egress:
    build:
      context: packages/egress-proxy
    image: ${STABLEHAND_IMAGE_REGISTRY:-ghcr.io/iofold}/stablehand-egress:${STABLEHAND_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Server defaults every sandbox gets unless its agent's egress is "deny".
      STABLEHAND_EGRESS_EXTRA_ALLOW: ${STABLEHAND_EGRESS_EXTRA_ALLOW:-}
      # What the runtime needs, kept even for "deny" agents (model providers are built in).
      STABLEHAND_EGRESS_RUNTIME_ALLOW: ${STABLEHAND_EGRESS_RUNTIME_ALLOW:-}
      STABLEHAND_EGRESS_LOG_ALLOWED: ${STABLEHAND_EGRESS_LOG_ALLOWED:-0}
      # Where the proxy checks each sandbox's session lease.
      STABLEHAND_EGRESS_LEASE_URL: ${STABLEHAND_EGRESS_LEASE_URL:-http://orchestrator:3001/api/egress/lease}
      # Requests without a lease on port 8080: "global" (server rules) or "deny". Set "deny" once
      # every running sandbox was started with a lease; until then a sandbox could drop its lease
      # and use 8080 to get the server rules instead of its agent's.
      STABLEHAND_EGRESS_UNLEASED: ${STABLEHAND_EGRESS_UNLEASED:-global}
    volumes:
      - egress-ca:/home/mitmproxy/.mitmproxy
      - egress-ca-public:/srv/egress-ca
    networks:
      - default
      - stablehand-agents

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    image: ${STABLEHAND_IMAGE_REGISTRY:-ghcr.io/iofold}/stablehand-ui:${STABLEHAND_IMAGE_TAG:-latest}
    ports:
      - "${UI_PORT:-3200}:80"
    # To publish the UI through Traefik with TLS, add deploy/compose/traefik/docker-compose.yml.
    depends_on:
      - orchestrator
    restart: unless-stopped

  # S3-compatible artifact store. Runs RustFS: MinIO stopped publishing pullable images
  # (Docker Hub, quay.io and Bitnami all refuse as of 2026-09). The service keeps the
  # `minio` name so existing S3_ENDPOINT=http://minio:9000 settings keep working.
  minio:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-stablehand}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-stablehand-dev}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${STABLEHAND_DATA_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${STABLEHAND_DATA_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - default
      - stablehand-agents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stablehand.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${STABLEHAND_DATA_BIND_ADDRESS:-127.0.0.1}:5050:80"
    depends_on:
      - postgres
    profiles:
      - debug

  # ── Sandbox harness images ──────────────────────────────────────────────────
  # Build-only services: `docker compose up --build` builds the images, but
  # the containers exit immediately (no CMD). The orchestrator spawns sandbox
  # containers dynamically via the Docker socket using these images.
  #
  # To clean up orphan sandbox containers after `docker compose down`:
  #   docker ps -aq --filter "label=stablehand.sandbox=true" | xargs -r docker rm -f

  sandbox-langgraph:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      target: harness-langgraph
    image: ${STABLEHAND_IMAGE_REGISTRY:-ghcr.io/iofold}/stablehand-harness-langgraph:${STABLEHAND_IMAGE_TAG:-latest}
    restart: "no"

  sandbox-claude-agents:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      target: harness-claude-agents
    image: ${STABLEHAND_IMAGE_REGISTRY:-ghcr.io/iofold}/stablehand-harness-claude-agents:${STABLEHAND_IMAGE_TAG:-latest}
    restart: "no"

  sandbox-pi-agent:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      target: harness-pi-agent
    image: ${STABLEHAND_IMAGE_REGISTRY:-ghcr.io/iofold}/stablehand-harness-pi-agent:${STABLEHAND_IMAGE_TAG:-latest}
    restart: "no"

volumes:
  pgdata:
  stablehand-data:
  minio-data:
  egress-ca:
  egress-ca-public:

networks:
  # Internal: sandboxes get no route to the internet except through the egress service.
  # Set STABLEHAND_SANDBOX_NETWORK to run a second stack on the same Docker host.
  stablehand-agents:
    driver: bridge
    name: ${STABLEHAND_SANDBOX_NETWORK:-stablehand-agents}
    internal: true
